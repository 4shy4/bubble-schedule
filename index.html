<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>气泡日程 · Bubble Schedule Demo</title>
<meta name="description" content="气泡浮动日程界面：大小 = 还剩多久，颜色 = 事情多大。纯前端、零依赖。" />
<!-- 空的 data: 图标：不写这一行浏览器会去请求 /favicon.ico 并拿到 404，
     在控制台留一条无意义的红字（demo 的 404 检查也会被它干扰）。 -->
<link rel="icon" href="data:," />
<!--
  刻意复用应用的**同一批样式表**（web/css/*.css 由生成器拷进来）。
  少一个气泡就长得不对：`.bubble-canvas` 在 views.css，
  颜色/圆角/字号的设计变量在 base.css。
-->
<link rel="stylesheet" href="web/css/base.css" />
<link rel="stylesheet" href="web/css/layout.css" />
<link rel="stylesheet" href="web/css/views.css" />
<link rel="stylesheet" href="web/css/components.css" />
<link rel="stylesheet" href="web/demo.css" />
<script>
  // 微信内置浏览器：它**会拦掉 .apk 下载**，所以先把话说明白（见下面 demo-bar / demo-hint 里的 wx-only 片段）。
  // 只往 <html> 上加一个 class，不联网、无依赖；老内核里 UA 读不到就走 catch，不影响任何别的功能。
  try { if (/MicroMessenger/i.test(navigator.userAgent)) document.documentElement.className += ' wechat'; } catch (e) {}
</script>
</head>
<body>
<!--
  ⚠️ `view-bubble` 这个类**不能省**：layout.css 里气泡区的"铺满"规则
     （去掉顶栏、去掉内容区内边距、把 .content 变成 flex 列）全部挂在
     `.app.view-bubble` 下面。少了它就不是全屏气泡，而是带一圈留白的普通视图。

  ⚠️ 也**不能有 .sidebar**：layout.css 的 `.app` 是
     `display:grid; grid-template-columns: var(--sidebar-w) 1fr`。
     没有侧栏时，`.main` 会落进**第一列**（= 收起态侧栏的 62px），
     整个主区被压成 62px 宽 —— 实测就是 62px。
     demo.css 里用 `grid-template-columns: 1fr` 覆盖掉。
-->
<div class="app view-bubble">
  <div class="main">
    <main class="content" id="view-host" tabindex="-1"></main>
  </div>
</div>

<!-- 顶部悬浮条：标题 / 统计 / 两个好玩的操作（重排、暂停漂浮）。
     不用应用的 .topbar —— 气泡视图下它是被隐藏的（空间全留给气泡），
     所以这里自己做一条浮层。 -->
<div class="demo-bar">
  <b id="view-title">气泡面板</b>
  <span id="view-subtitle" class="demo-sub"></span>
  <span class="demo-nav" id="view-nav"></span>
  <!-- 去下载页。这是个**网页**（不是微信小程序），所以在页面上给出下载入口没有任何规则问题；
       而且入口做得克制一点：一行小字，不抢气泡的视觉。 -->
  <a class="demo-install" href="install.html">下载到手机</a>
</div>

<div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="false"></div>

<div class="demo-hint">
  <b>怎么玩</b> ·
  拖动气泡挪开 ·
  单击 = 编辑 ·
  <b>双击</b> = 进去（套娃）·
  <b>长按 2.5 秒</b> = 戳破 ·
  单击空白 = 新建 ·
  右下角 <b>?</b> 展开说明
  <!-- ⚠️ 微信里这一条才显示：微信会拦 .apk 下载，"点这里下载"在微信里是死路，
       必须先告诉人去「在浏览器打开」。 -->
  <span class="wx-only">
    · 想装到手机上：点右上角 <b>⋯</b> → <b>在浏览器打开</b>，再打开 <a href="install.html">下载页</a>
  </span>
</div>

<!--
  ⚠️⚠️ 载入失败的兜底 —— 这个块比它看起来重要。

  这个页面全靠一行 `<script type="module" src="web/demo.js">`。而下面两种情况
  **都是白屏**，用户在页面上看不到任何线索：
    ① 内核不支持 ES module（老 X5 / Android 微信内置浏览器 / 很老的 Safari）；
    ② 内核支持，但模块加载或执行失败（相对路径少了层、网络被截断、某个 import 抛错）。
  情况 ① 用 `nomodule` 接（那个脚本在支持 module 的内核里**根本不会执行**）；
  情况 ② 用看门狗接。

  为什么用"标志位 + 超时"而不是 try/catch 包住 import：
    module 的解析/执行发生在**另一个脚本上下文**里，这里的 catch 抓不到它的错。
    唯一可靠的判据是"渲染完成后自己举一下手"（web/demo.js 末尾写 __bubbleBooted）。
  为什么 6 秒：慢网下真正加载完大约 1 秒内；6 秒是"明显不对劲"的量级，
    又不至于让用户等太久。宁可晚一点报，也不要误报。
-->
<div id="boot-error" class="boot-error">
  <div class="boot-error-in">
    <h1>这个浏览器没能打开这个页面</h1>
    <p>
      页面用的是 ES module，需要较新的浏览器。<br />
      如果你是在<b>微信</b>里：点右上角 <b>⋯</b> → <b>在浏览器打开</b>。
    </p>
    <p class="boot-url mono" id="boot-url"></p>
    <p><a class="boot-go" href="install.html">下载到手机 →</a></p>
  </div>
</div>

<script nomodule>
  // 只有"不支持 ES module"的内核才会执行这里 —— 正好是白屏的第 ① 种情况。
  document.documentElement.className += ' no-module';
</script>
<script>
  // 看门狗（经典脚本：不支持 module 的内核也会跑它）。
  (function () {
    try { document.getElementById('boot-url').textContent = location.href; } catch (e) {}
    window.__bubbleBootTimer = setTimeout(function () {
      if (!window.__bubbleBooted) {
        var el = document.getElementById('boot-error');
        if (el) el.className += ' on';
      }
    }, 6000);
  })();
</script>

<script type="module" src="web/demo.js"></script>
</body>
</html>
